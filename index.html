<!doctype html>

<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<title>Para mi Lexi</title>
<link rel="canonical" href="https://papijulis.github.io/para-mi-lexi/">
<meta http-equiv="refresh" content="0; url=https://papijulis.github.io/para-mi-lexi/">
<script>
  /* La página se mudó a /para-mi-lexi/. Se conserva lo que venga después de
     /sorpresa-lexi/ (ruta, ?fecha=… y #…) para que cualquier enlace viejo siga
     llevando al mismo lugar. */
  (function () {
    var resto = location.pathname.replace(/^\/sorpresa-lexi\/?/, '');
    location.replace('https://papijulis.github.io/para-mi-lexi/' + resto + location.search + location.hash);
  })();
</script>

  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #12021f; color: #fdfbf7; font: 1rem/1.5 Georgia, serif; text-align: center; padding: 1rem; }
  a { color: #ffd700; }
</style>
</head>
<body>

</body>
